name: Notícias médicas — PubMed/sociedades/faculdades (revisão manual)

# Busca em PubMed, sociedades médicas e faculdades de medicina (ver
# scripts/medical-news/sources/pubmed.ts e sources/rss.ts) e escreve os
# rascunhos em src/data/updates-pending.ts, que NÃO é importado pelo site.
# O PR fica aberto para revisão humana — nunca faz merge automático.
#
# Requer, nas configurações do repositório:
# - Settings → Actions → General → Workflow permissions: "Read and write permissions"
# - Secret ANTHROPIC_API_KEY (Settings → Secrets and variables → Actions)
# - Opcional: secret NCBI_API_KEY para aumentar o rate limit do PubMed

on:
  schedule:
    - cron: "0 9 * * 1" # semanal, segunda-feira 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch-drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Buscar e resumir (PubMed, sociedades, faculdades)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: npx tsx scripts/medical-news/run.ts --tier=revisao

      - name: Checar se há mudanças
        id: git-check
        run: echo "changed=$(git diff --quiet src/data/updates-pending.ts && echo false || echo true)" >> "$GITHUB_OUTPUT"

      - name: Validar build
        if: steps.git-check.outputs.changed == 'true'
        run: |
          npx tsc --noEmit
          npx eslint .

      - name: Abrir PR para revisão
        if: steps.git-check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Rascunhos de notícias (PubMed/sociedades/faculdades) para revisão"
          title: "📝 Rascunhos de notícias médicas — aguardando revisão"
          body: |
            Gerado automaticamente pelo workflow `medical-news-review.yml`.
            Fontes: PubMed, sociedades médicas e faculdades de medicina (ver
            `scripts/medical-news/sources/pubmed.ts` e `sources/rss.ts`).

            **Este PR NÃO faz merge automático.** Cada item em
            `src/data/updates-pending.ts` precisa ser revisado por um humano
            e movido manualmente para `src/data/updates.ts` (ajustando texto/
            fontes conforme necessário) antes de aparecer no site.
          branch: bot/noticias-revisao
          labels: noticias-automaticas,revisao-pendente
